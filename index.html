<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GeneAir Research</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #faf9f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #__bundler_loading {
        position: fixed;
        bottom: 20px;
        right: 20px;
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #666;
        background: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        z-index: 10000;
      }
      #__bundler_thumbnail {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf9f5;
        z-index: 9999;
      }
      #__bundler_thumbnail svg {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #__bundler_placeholder {
        color: #999;
        font-size: 14px;
      }
    </style>
    <noscript>
      <style>
        #__bundler_loading {
          display: none;
        }
      </style>
      <div
        style="
          position: fixed;

      </div>

  <body>
    <div id="__bundler_placeholder">Loading GeneAir Research...</div>
    <div id="__bundler_loading">Unpacking...</div>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const loading = document.getElementById("__bundler_loading");
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        const FONT_MIME =
          /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
        const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
        function toBase64(bytes) {
          let bin = "";
          for (let i = 0; i < bytes.length; i += 0x8000) {
            bin += String.fromCharCode.apply(
              null,
              bytes.subarray(i, i + 0x8000),
            );
          }
          return btoa(bin);
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          "error",
          function (e) {
            // Failed resource loads (CSP-blocked links, scripts, images) fire plain
            // events at the element — warn only; real JS errors carry message/error.
            if (!e.message && !e.error && e.target && e.target !== window) {
              console.warn(
                "[bundle] resource failed to load:",
                e.target.tagName,
                String(e.target.src || e.target.href || ""),
              );
              return;
            }
            var p = document.body || document.documentElement;
            var d =
              document.getElementById("__bundler_err") ||
              p.appendChild(document.createElement("div"));
            d.id = "__bundler_err";
            d.style.cssText =
              "position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto";
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : "") +
              "[bundle] " +
              (e.message || e.type) +
              (e.filename
                ? " (" + e.filename.slice(0, 60) + ":" + e.lineno + ")"
                : "");
          },
          true,
        );

        try {
          const manifestEl = document.querySelector(
            'script[type="__bundler/manifest"]',
          );
          const templateEl = document.querySelector(
            'script[type="__bundler/template"]',
          );
          if (!manifestEl || !templateEl) {
            setStatus("Error: missing bundle data");
            console.error(
              "[bundler] Missing script tags — manifestEl:",
              !!manifestEl,
              "templateEl:",
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
          // document's manifest; frame srcs carry an about:blank#<uuid> marker
          // instead of a substitutable uuid. Every document mints the blobs for
          // its OWN frames — from local text at the root, or text obtained from
          // its DIRECT parent over the relay protocol below — so each frame
          // navigation stays same-origin with its initiator and a deduped page
          // loads at any depth on any host, including a file:// download's
          // opaque origins (where a blob minted by one document cannot be
          // navigated to by another).
          const pageOrderEl = document.querySelector(
            'script[type="__bundler/page_order"]',
          );
          const pageOrder = pageOrderEl
            ? JSON.parse(pageOrderEl.textContent)
            : [];
          const pageSet = new Set(pageOrder);
          const pageTexts = {};

          // ── Nested-page text protocol (parent-chain relay) ──
          // Page bundles ship once, in the ROOT document's manifest. Every
          // document mints the blobs for its OWN frames, obtaining page text
          // through a strict parent-chain relay: a document only ever SENDS to
          // its direct parent (which, for every document the publisher's own
          // runtime minted, is another publisher document) and only ACCEPTS
          // text from that direct parent; requests from below are honored only
          // for the document's own child frames, and the ROOT never sends
          // upward at all. That last rule is load-bearing: the artifact host's
          // frame-ancestors allows claude.ai (and friends) to frame an
          // artifact, so window.top can be a FOREIGN document — a top-addressed
          // protocol would hand page uuids to that ancestor and accept forged
          // "page text" from it, minting attacker HTML as an artifact-origin
          // blob document. The chain never touches the ancestor: requests stop
          // at the root, replies are origin-addressed per hop (never '*' when
          // an origin exists), and both directions are origin-gated (on https
          // a foreign sender's origin can never equal this document's; in
          // opaque contexts — file:// — everything serializes as 'null', where
          // an embedded EXTERNAL frame still fails the gate by carrying its
          // own real origin, and a sandboxed child of such a frame is excluded
          // by the own-child-frames check plus uuid unguessability). Shape is
          // deny-by-default: one request form, one reply form, no error
          // replies.
          // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
          // contexts such as a sandboxed preview iframe) — location.origin is
          // computed from the URL and stays 'https://…' even when the document
          // is sandboxed, which would misgate every opaque chain.
          const OWN_TARGET = /^https?:[/][/]/.test(window.origin || "")
            ? window.origin
            : "*";
          function trustedOrigin(e) {
            if (e.origin === window.origin) return true; // https chains; opaque==opaque
            // file:// trees: Chrome serializes the file document's origin as
            // 'file://' while the blob: documents it mints serialize as 'null',
            // so the two legitimate shapes can never string-match — accept the
            // pair in both directions. https origins never serialize as either,
            // and sender identity (own child frame / direct parent) is checked
            // separately.
            return (
              (e.origin === "null" &&
                (window.origin === "file://" ||
                  window.location.protocol === "file:")) ||
              (/^file:/.test(e.origin) && window.origin === "null")
            );
          }
          // Non-empty only in the root document (nested bundles ship an empty
          // island), so it doubles as the root marker: the root answers from
          // local text and treats a miss as authoritative — never relaying to
          // its (possibly foreign) parent.
          const isPageRoot = pageOrder.length > 0;
          const blobUrls = {};
          const resourceBlobs = {};
          const UUID_SHAPE =
            /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
          const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
          const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
          function mountPage(el, frag, text) {
            const pageBlob = new Blob([text], { type: "text/html" });
            const u = URL.createObjectURL(pageBlob);
            resourceBlobs[u] = pageBlob;
            el.src = u + frag;
          }
          function deliverPage(uuid, text) {
            const frames = pendingFrames[uuid];
            delete pendingFrames[uuid];
            if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
            const relays = pendingRelays[uuid];
            delete pendingRelays[uuid];
            if (relays) {
              for (const cw of relays) {
                try {
                  cw.postMessage(
                    { __bundler_page: uuid, __bundler_text: text },
                    OWN_TARGET,
                  );
                } catch (err) {
                  /* gone */
                }
              }
            }
          }
          function ownFrameWindows() {
            const out = [];
            for (const f of Array.from(document.querySelectorAll("iframe"))) {
              try {
                if (f.contentWindow) out.push(f.contentWindow);
              } catch (err) {
                /* detached */
              }
            }
            return out;
          }
          window.addEventListener("message", function (e) {
            const d = e.data;
            if (!d || typeof d !== "object" || !e.source) return;
            // Origin gate first; the structural checks below (own-child-frames
            // for requests, direct-parent + solicited-uuid for replies, the
            // root's never-relay rule) are what hold in fully opaque chains
            // where origin strings can't discriminate — a sandboxed root's
            // FOREIGN wrapper still fails all three even though both serialize
            // as real-vs-'null' rather than matching.
            if (!trustedOrigin(e)) return;
            if (
              typeof d.__bundler_need === "string" &&
              UUID_SHAPE.test(d.__bundler_need)
            ) {
              // Requests are honored only for this document's own child frames.
              if (ownFrameWindows().indexOf(e.source) < 0) return;
              const uuid = d.__bundler_need;
              const text = pageTexts[uuid];
              if (typeof text === "string") {
                try {
                  e.source.postMessage(
                    { __bundler_page: uuid, __bundler_text: text },
                    OWN_TARGET,
                  );
                } catch (err) {
                  /* gone */
                }
                return;
              }
              if (isPageRoot || window.parent === window) return; // authoritative miss
              const waiting = pendingRelays[uuid];
              if (waiting) {
                if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
                return;
              }
              // Never-answered uuids would otherwise accumulate forever under a
              // request spray; past the cap (far above any real page count) new
              // relays are dropped rather than remembered.
              if (Object.keys(pendingRelays).length >= 128) return;
              pendingRelays[uuid] = [e.source];
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            } else if (
              typeof d.__bundler_page === "string" &&
              UUID_SHAPE.test(d.__bundler_page) &&
              typeof d.__bundler_text === "string"
            ) {
              // The shape test is load-bearing beyond tidiness: the solicited
              // check below uses the in operator, which matches prototype keys
              // ('__proto__', 'constructor') — an unshaped key would reach
              // deliverPage and throw, painting the error banner.
              // Text is accepted only from the direct parent — the document
              // that minted this one.
              if (e.source !== window.parent || window.parent === window)
                return;
              if (
                !(d.__bundler_page in pendingFrames) &&
                !(d.__bundler_page in pendingRelays)
              )
                return;
              deliverPage(d.__bundler_page, d.__bundler_text);
            }
          });

          const uuids = Object.keys(manifest);
          setStatus("Unpacking " + uuids.length + " assets...");

          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++)
                  bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== "undefined") {
                    const ds = new DecompressionStream("gzip");
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      "DecompressionStream not available, asset " +
                        uuid +
                        " may not render",
                    );
                  }
                }

                if (pageSet.has(uuid)) {
                  pageTexts[uuid] = new TextDecoder().decode(finalBytes);
                  return;
                }
                if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
                  // Strict artifact hosts allow font-src data: but not blob:.
                  blobUrls[uuid] =
                    "data:" +
                    entry.mime +
                    ";base64," +
                    (entry.compressed ? toBase64(finalBytes) : entry.data);
                } else {
                  const blob = new Blob([finalBytes], { type: entry.mime });
                  blobUrls[uuid] = URL.createObjectURL(blob);
                  resourceBlobs[blobUrls[uuid]] = blob;
                }
              } catch (err) {
                console.error("Failed to decode asset " + uuid + ":", err);
                const blob = new Blob([], { type: entry.mime });
                blobUrls[uuid] = URL.createObjectURL(blob);
                resourceBlobs[blobUrls[uuid]] = blob;
              }
            }),
          );

          const extResEl = document.querySelector(
            'script[type="__bundler/ext_resources"]',
          );
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid])
              resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
          // consumers read these Blobs directly. Survives the swap like the error sink.
          window.__resourceBlobs = resourceBlobs;

          setStatus("Rendering...");
          // Page uuids have no blob here — they ride inside about:blank#<uuid>
          // frame markers the pass below resolves after the swap.
          for (const uuid of uuids) {
            if (pageSet.has(uuid)) continue;
            template = template.split(uuid).join(blobUrls[uuid]);
          }

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
          // bundler left live-fetched (an absolute x-import, a runtime dependency it
          // could not embed, an authored external script) keeps the pin it was
          // written with: that fetch is exactly what SRI protects. (A crossorigin
          // on a parent whose child carries the blob — <video crossorigin><source>
          // — is left alone too; the attribute is then the author's to drop.)
          template = template.replace(/<[a-z][^>]*>/gi, (tag) =>
            /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag)
              ? tag
                  .replace(/\s+integrity="[^"]*"/gi, "")
                  .replace(/\s+crossorigin="[^"]*"/gi, "")
              : tag,
          );

          const resourceScript =
            "<script>window.__resources = " +
            JSON.stringify(resourceMap).replace(/<\//g, "<\\/") +
            ";</" +
            "script>";
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template =
              template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, "text/html");
          document.documentElement.replaceWith(doc.documentElement);

          // Resolve page-frame markers: mint this document's own blob for each
          // framed page — from local text when this is the root, otherwise by
          // asking the direct parent over the relay protocol above. An
          // unanswered request leaves the frame on about:blank, the same
          // degraded state as a refused embed.
          {
            const MARKER =
              /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
            const needed = [];
            for (const el of Array.from(document.querySelectorAll("iframe"))) {
              const m = MARKER.exec(el.getAttribute("src") || "");
              if (!m) continue;
              const text = pageTexts[m[1]];
              if (typeof text === "string") {
                mountPage(el, m[2] || "", text);
              } else if (window.parent !== window && !isPageRoot) {
                const had = pendingFrames[m[1]];
                (pendingFrames[m[1]] = had || []).push({
                  el: el,
                  frag: m[2] || "",
                });
                if (!had) needed.push(m[1]);
              }
            }
            for (const uuid of needed) {
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            }
          }

          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement("script");
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: read and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === "text/babel" || s.type === "text/jsx") && s.src) {
              const pre = resourceBlobs[s.src.split("#")[0]];
              s.textContent = pre
                ? await pre.text()
                : await (await fetch(s.src)).text();
              s.removeAttribute("src");
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (
            window.Babel &&
            typeof window.Babel.transformScriptTags === "function"
          ) {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus("Error unpacking: " + err.message);
          console.error("Bundle unpack error:", err);
        }
      });
    </script>

amily:'Manrope',system-ui,sans-serif;color:#0E2240;-webkit-font-smoothing:antialiased}\na{color:#0B3B7C}a:hover{color:#0F7A5C}\n.nav-link{color:#0E2240;text-decoration:none;font-weight:600;font-size:15px;padding:12px 6px}\n.nav-link:hover{color:#0F7A5C}\n.btn-primary{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:999px;background:#0B3B7C;color:#FFFFFF;font-weight:700;font-size:16px;text-decoration:none}\n.btn-primary:hover{background:#0F7A5C;color:#FFFFFF}\n.btn-ghost{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:999px;border:2px solid #0B3B7C;color:#0B3B7C;font-weight:700;font-size:16px;text-decoration:none}\n.btn-ghost:hover{border-color:#0F7A5C;color:#0F7A5C}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"width:100%;background:#FFFFFF;overflow-x:hidden\" data-canvas-width=\"1366\" data-canvas-height=\"4700\" data-document-role=\"page\" data-label=\"GeneAir – Research site\">\n\n<!-- NAV -->\n<header style=\"background:#FFFFFF;border-bottom:1px solid #DCE8F3\">\n<div style=\"max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 32px\">\n<a href=\"#top\" style=\"display:flex;align-items:center;gap:12px;text-decoration:none\">\n<img src=\"41cbc137-8353-423b-aea8-28ee2629da43\" alt=\"GeneAir logo\" style=\"width:48px;height:48px;object-fit:contain\">\n<span style=\"font-family:'Sora',sans-serif;font-weight:800;font-size:24px;color:#0B3B7C;letter-spacing:-0.5px\">Gene<span style=\"color:#0F7A5C\">Air<\u002Fspan><\u002Fspan>\n<\u002Fa>\n<nav aria-label=\"Primary\" style=\"display:flex;flex-wrap:wrap;gap:4px 22px\">\n<a class=\"nav-link\" href=\"#overview\">Overview<\u002Fa>\n<a class=\"nav-link\" href=\"#approach\">Approach<\u002Fa>\n<a class=\"nav-link\" href=\"#system\">System<\u002Fa>\n<a class=\"nav-link\" href=\"#explainable\">Explainability<\u002Fa>\n<a class=\"nav-link\" href=\"#method\">Method<\u002Fa>\n<a class=\"nav-link\" href=\"#team\">Team<\u002Fa>\n<a class=\"nav-link\" href=\"#contact\">Contact<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<!-- HERO -->\n<section id=\"top\" style=\"background:linear-gradient(180deg,#EAF4FB 0%,#FFFFFF 100%);position:relative\">\n<div style=\"max-width:1200px;margin:0 auto;padding:72px 24px 80px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:56px;align-items:center\">\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"display:inline-flex;align-self:flex-start;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:#FFFFFF;border:1px solid #CFE0EE;font-size:14px;font-weight:700;color:#0B3B7C\">\n<span style=\"width:8px;height:8px;border-radius:50%;background:#1B9E77\"><\u002Fspan>Research project · Sri Lanka Institute Of Information Technology / Faculty Of Computing\n<\u002Fdiv>\n<h1 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(44px,7vw,84px);line-height:1;letter-spacing:-2px;color:#0B3B7C\">Gene<span style=\"color:#1B9E77\">Air<\u002Fspan><\u002Fh1>\n<p style=\"margin:0;font-family:'Sora',sans-serif;font-weight:600;font-size:clamp(22px,3vw,30px);line-height:1.3;color:#0E2240;text-wrap:balance\">Genetic-Adaptive Multimodal Asthma Prediction and Decision Support<\u002Fp>\n<p style=\"margin:0;font-size:18px;line-height:1.65;color:#3F5471;max-width:540px;text-wrap:pretty\">We study whether combining a person's genetic profile with wearable signals and environmental exposure can predict asthma risk earlier, explain it clearly, and support better decisions for patients and clinicians.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:14px\">\n<a class=\"btn-primary\" href=\"#overview\">Explore the research<\u002Fa>\n<a class=\"btn-ghost\" href=\"#team\">Meet the team<\u002Fa>\n<\u002Fdiv>\n<p style=\"margin:0;font-family:'Sora',sans-serif;font-weight:600;font-size:16px;color:#0F7A5C\">Understand Today. Act Early. Breathe Better Tomorrow.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:flex;justify-content:center\">\n<div style=\"position:relative;width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:20px\">\n<img src=\"41cbc137-8353-423b-aea8-28ee2629da43\" alt=\"GeneAir emblem: lungs with a DNA helix inside a circular badge\" style=\"width:min(300px,70%);height:auto;border-radius:50%;box-shadow:0 24px 60px rgba(11,59,124,0.18)\">\n<div style=\"width:100%;background:#FFFFFF;border:1px solid #D5E4F0;border-radius:24px;padding:20px 24px;box-shadow:0 12px 36px rgba(11,59,124,0.10);display:flex;align-items:center;gap:20px\">\n<svg width=\"120\" height=\"76\" sc-camel-view-box=\"0 0 240 150\" role=\"img\" aria-label=\"Risk gauge showing low risk\" style=\"flex:none\">\n<path d=\"M20 120 A100 100 0 0 1 220 120\" fill=\"none\" stroke=\"#E3EDF5\" stroke-width=\"22\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M20 120 A100 100 0 0 1 220 120\" fill=\"none\" stroke=\"#1B9E77\" stroke-width=\"22\" stroke-linecap=\"round\" sc-camel-path-length=\"100\" stroke-dasharray=\"28 100\"><\u002Fpath>\n<\u002Fsvg>\n<div style=\"display:flex;flex-direction:column;gap:2px\">\n<span style=\"font-size:13px;font-weight:600;color:#4A5D78\">Current risk · concept illustration<\u002Fspan>\n<span style=\"font-family:'Sora',sans-serif;font-weight:800;font-size:22px;color:#0F7A5C\">LOW RISK<\u002Fspan>\n<span style=\"font-size:14px;color:#3F5471\">Condition: stable<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PILLARS -->\n<section style=\"background:#FFFFFF\">\n<div style=\"max-width:1200px;margin:0 auto;padding:16px 24px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:20px\">\n\n<div style=\"display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:20px;background:#F2F8FC\">\n<svg width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"#0B3B7C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"12\" y=\"12\" width=\"24\" height=\"24\" rx=\"7\"><\u002Frect><path d=\"M17 12l2-7h10l2 7M17 36l2 7h10l2-7\"><\u002Fpath><path d=\"M24 29s-6-3.6-6-7.4a3.4 3.4 0 0 1 6-2 3.4 3.4 0 0 1 6 2c0 3.8-6 7.4-6 7.4z\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin:0;font-family:'Sora',sans-serif;font-size:19px;color:#0B3B7C\">Continuous Monitoring<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#3F5471\">Wearable and environmental signals tracked over time rather than at a single clinic visit.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:20px;background:#F2F8FC\">\n<svg width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"#0B3B7C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 32a18 18 0 1 1 36 0\"><\u002Fpath><path d=\"M24 32l8-10\"><\u002Fpath><circle cx=\"24\" cy=\"32\" r=\"2.5\"><\u002Fcircle><circle cx=\"38\" cy=\"14\" r=\"0\"><\u002Fcircle><\u002Fsvg>\n<h3 style=\"margin:0;font-family:'Sora',sans-serif;font-size:19px;color:#0B3B7C\">Personalized Risk<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#3F5471\">A risk estimate that adapts to each person's genetic profile instead of one-size-fits-all thresholds.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:20px;background:#F2F8FC\">\n<svg width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"#0B3B7C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 9h26a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H18l-8 7v-7H6a3 3 0 0 1-3-3V12a3 3 0 0 1 3-3z\"><\u002Fpath><path d=\"M14 19h.01M20 19h.01M26 19h.01\"><\u002Fpath><path d=\"M38 17h4a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-2v6l-7-6h-8\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin:0;font-family:'Sora',sans-serif;font-size:19px;color:#0B3B7C\">Explainable Guidance<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#3F5471\">Every change in risk comes with a plain-language reason a patient can act on.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px;padding:24px;border-radius:20px;background:#F2F8FC\">\n<svg width=\"44\" height=\"44\" sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"#0B3B7C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 5v14a8 8 0 0 0 16 0V5\"><\u002Fpath><path d=\"M12 5h4M28 5h4\"><\u002Fpath><path d=\"M22 27v6a8 8 0 0 0 16 0v-3\"><\u002Fpath><circle cx=\"38\" cy=\"26\" r=\"3.5\"><\u002Fcircle><\u002Fsvg>\n<h3 style=\"margin:0;font-family:'Sora',sans-serif;font-size:19px;color:#0B3B7C\">Connected Clinical Care<\u002Fh3>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#3F5471\">A clinician view that surfaces risk history, alerts and the genetic profile behind each prediction.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- OVERVIEW -->\n<section id=\"overview\" style=\"background:#FFFFFF\">\n<div style=\"max-width:1200px;margin:0 auto;padding:96px 24px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<span style=\"font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#0F7A5C\">Overview<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(30px,4vw,44px);line-height:1.15;letter-spacing:-1px;color:#0B3B7C;text-wrap:balance\">Asthma risk is personal. Prediction should be too.<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:18px;font-size:17px;line-height:1.7;color:#3F5471\">\n<p style=\"margin:0;text-wrap:pretty\">Asthma varies widely between people: what triggers an attack, how quickly symptoms build, and how a person responds to air quality all differ. Many monitoring approaches rely on a single data source or fixed thresholds, which can miss early warning signs.<\u002Fp>\n<p style=\"margin:0;text-wrap:pretty\">GeneAir investigates a genetic-adaptive, multimodal approach. It fuses a person's genetic profile with continuous physiological signals and environmental exposure, then adapts its prediction to the individual and explains the result.<\u002Fp>\n<p style=\"margin:0;font-size:14px;color:#4A5D78\">[ADD: one sentence with a cited prevalence or burden figure for your target population, with source.]<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- APPROACH -->\n<section id=\"approach\" style=\"background:#F2F8FC\">\n<div style=\"max-width:1200px;margin:0 auto;padding:96px 24px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px;max-width:720px\">\n<span style=\"font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#0F7A5C\">Approach<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(30px,4vw,44px);line-height:1.15;letter-spacing:-1px;color:#0B3B7C;text-wrap:balance\">Three data streams, one adaptive model<\u002Fh2>\n<p style=\"margin:0;font-size:17px;line-height:1.7;color:#3F5471;text-wrap:pretty\">Each modality captures a different part of the story. The model learns how much weight each one deserves for a given person.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:24px\">\n\n<div style=\"background:#FFFFFF;border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:16px;border:1px solid #D5E4F0\">\n<svg width=\"48\" height=\"48\" sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"#0F7A5C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 5c0 10 20 10 20 19s-20 9-20 19\"><\u002Fpath><path d=\"M34 5c0 10-20 10-20 19s20 9 20 19\"><\u002Fpath><path d=\"M17 12h14M17 36h14M15 24h18\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin:0;font-family:'Sora',sans-serif;font-size:21px;color:#0B3B7C\">Genetic profile<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.65;color:#3F5471\">Inherited markers associated with asthma susceptibility and response give the model a stable, personal baseline.<\u002Fp>\n<p style=\"margin:0;font-size:14px;color:#4A5D78\">[ADD: gene markers / panel used]<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background:#FFFFFF;border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:16px;border:1px solid #D5E4F0\">\n<svg width=\"48\" height=\"48\" sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"#0F7A5C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 26h9l4-12 7 22 6-16 3 6h13\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin:0;font-family:'Sora',sans-serif;font-size:21px;color:#0B3B7C\">Wearable signals<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.65;color:#3F5471\">Heart rate, blood oxygen (SpO<sub>2<\u002Fsub>) and activity patterns reveal how the body is responding right now.<\u002Fp>\n<p style=\"margin:0;font-size:14px;color:#4A5D78\">[ADD: device, sampling rate]<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background:#FFFFFF;border-radius:24px;padding:32px;display:flex;flex-direction:column;gap:16px;border:1px solid #D5E4F0\">\n<svg width=\"48\" height=\"48\" sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"#0F7A5C\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 18h22a5 5 0 1 0-5-5\"><\u002Fpath><path d=\"M4 26h32a5 5 0 1 1-5 5\"><\u002Fpath><path d=\"M10 34h14a4 4 0 1 1-4 4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin:0;font-family:'Sora',sans-serif;font-size:21px;color:#0B3B7C\">Environmental exposure<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.65;color:#3F5471\">Air quality and ambient conditions around the person supply the triggers that genes and physiology react to.<\u002Fp>\n<p style=\"margin:0;font-size:14px;color:#4A5D78\">[ADD: exposure variables and source]<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SYSTEM -->\n<section id=\"system\" style=\"background:#FFFFFF\">\n<div style=\"max-width:1200px;margin:0 auto;padding:96px 24px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px;max-width:720px\">\n<span style=\"font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#0F7A5C\">System<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(30px,4vw,44px);line-height:1.15;letter-spacing:-1px;color:#0B3B7C;text-wrap:balance\">From raw signals to a decision<\u002Fh2>\n<\u002Fdiv>\n\n<ol style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:20px\">\n<li style=\"display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:20px;border:1px solid #D5E4F0\">\n<span style=\"font-family:'Sora',sans-serif;font-weight:800;font-size:15px;color:#0F7A5C\">01<\u002Fspan>\n<strong style=\"font-family:'Sora',sans-serif;font-size:18px;color:#0B3B7C\">Collect<\u002Fstrong>\n<span style=\"font-size:15px;line-height:1.6;color:#3F5471\">Genetic data, wearable streams and environmental readings are gathered and time-aligned.<\u002Fspan>\n<\u002Fli>\n<li style=\"display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:20px;border:1px solid #D5E4F0\">\n<span style=\"font-family:'Sora',sans-serif;font-weight:800;font-size:15px;color:#0F7A5C\">02<\u002Fspan>\n<strong style=\"font-family:'Sora',sans-serif;font-size:18px;color:#0B3B7C\">Encode<\u002Fstrong>\n<span style=\"font-size:15px;line-height:1.6;color:#3F5471\">Each modality is cleaned and turned into features by an encoder suited to its type.<\u002Fspan>\n<\u002Fli>\n<li style=\"display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:20px;border:1px solid #D5E4F0\">\n<span style=\"font-family:'Sora',sans-serif;font-weight:800;font-size:15px;color:#0F7A5C\">03<\u002Fspan>\n<strong style=\"font-family:'Sora',sans-serif;font-size:18px;color:#0B3B7C\">Adapt and fuse<\u002Fstrong>\n<span style=\"font-size:15px;line-height:1.6;color:#3F5471\">The genetic profile conditions how the other streams are weighed and combined.<\u002Fspan>\n<\u002Fli>\n<li style=\"display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:20px;border:1px solid #D5E4F0\">\n<span style=\"font-family:'Sora',sans-serif;font-weight:800;font-size:15px;color:#0F7A5C\">04<\u002Fspan>\n<strong style=\"font-family:'Sora',sans-serif;font-size:18px;color:#0B3B7C\">Predict<\u002Fstrong>\n<span style=\"font-size:15px;line-height:1.6;color:#3F5471\">A personalized risk level is produced and tracked as it changes over time.<\u002Fspan>\n<\u002Fli>\n<li style=\"display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:20px;border:1px solid #D5E4F0\">\n<span style=\"font-family:'Sora',sans-serif;font-weight:800;font-size:15px;color:#0F7A5C\">05<\u002Fspan>\n<strong style=\"font-family:'Sora',sans-serif;font-size:18px;color:#0B3B7C\">Explain<\u002Fstrong>\n<span style=\"font-size:15px;line-height:1.6;color:#3F5471\">The factors driving the prediction are translated into guidance in plain language.<\u002Fspan>\n<\u002Fli>\n<li style=\"display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:20px;border:1px solid #D5E4F0\">\n<span style=\"font-family:'Sora',sans-serif;font-weight:800;font-size:15px;color:#0F7A5C\">06<\u002Fspan>\n<strong style=\"font-family:'Sora',sans-serif;font-size:18px;color:#0B3B7C\">Support<\u002Fstrong>\n<span style=\"font-size:15px;line-height:1.6;color:#3F5471\">Patients see a simple view; clinicians see history, alerts and the genetic profile.<\u002Fspan>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- EXPLAINABLE / TWO VIEWS -->\n<section id=\"explainable\" style=\"background:#0B2A55;color:#FFFFFF\">\n<div style=\"max-width:1200px;margin:0 auto;padding:96px 24px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px;max-width:720px\">\n<span style=\"font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#6FE0BC\">Explainability<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(30px,4vw,44px);line-height:1.15;letter-spacing:-1px;color:#FFFFFF;text-wrap:balance\">Two people, one prediction, two views<\u002Fh2>\n<p style=\"margin:0;font-size:17px;line-height:1.7;color:#C9D9EC;text-wrap:pretty\">A patient needs to know what to do. A clinician needs to know why. GeneAir is designed to answer both from the same model. Interface sketches below are concept illustrations, not real data.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:28px\">\n\n<!-- patient -->\n<div style=\"background:#FFFFFF;color:#0E2240;border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:20px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#4A5D78\">Patient view<\u002Fspan>\n<div style=\"display:flex;align-items:center;gap:20px\">\n<svg width=\"110\" height=\"70\" sc-camel-view-box=\"0 0 240 150\" role=\"img\" aria-label=\"Risk gauge\" style=\"flex:none\">\n<path d=\"M20 120 A100 100 0 0 1 220 120\" fill=\"none\" stroke=\"#E3EDF5\" stroke-width=\"22\" stroke-linecap=\"round\"><\u002Fpath>\n<path d=\"M20 120 A100 100 0 0 1 220 120\" fill=\"none\" stroke=\"#1B9E77\" stroke-width=\"22\" stroke-linecap=\"round\" sc-camel-path-length=\"100\" stroke-dasharray=\"28 100\"><\u002Fpath>\n<\u002Fsvg>\n<div style=\"display:flex;flex-direction:column\">\n<span style=\"font-family:'Sora',sans-serif;font-weight:800;font-size:22px;color:#0F7A5C\">LOW RISK<\u002Fspan>\n<span style=\"font-size:14px;color:#3F5471\">Condition: stable<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<strong style=\"font-family:'Sora',sans-serif;font-size:17px;color:#0B3B7C\">Why did my risk increase?<\u002Fstrong>\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#F2F8FC;font-size:15px;color:#27405F\"><span style=\"width:10px;height:10px;border-radius:50%;background:#0B3B7C;flex:none\"><\u002Fspan>Environmental exposure increased<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#F2F8FC;font-size:15px;color:#27405F\"><span style=\"width:10px;height:10px;border-radius:50%;background:#0B3B7C;flex:none\"><\u002Fspan>Recent SpO<sub>2<\u002Fsub> pattern changed<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#F2F8FC;font-size:15px;color:#27405F\"><span style=\"width:10px;height:10px;border-radius:50%;background:#0B3B7C;flex:none\"><\u002Fspan>Recent activity pattern changed<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- clinician -->\n<div style=\"background:#FFFFFF;color:#0E2240;border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:20px\">\n<span style=\"font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#4A5D78\">Clinician view<\u002Fspan>\n<strong style=\"font-family:'Sora',sans-serif;font-size:17px;color:#0B3B7C\">Risk history<\u002Fstrong>\n<svg sc-camel-view-box=\"0 0 400 150\" width=\"100%\" role=\"img\" aria-label=\"Illustrative line chart of risk over time with one highlighted period\" style=\"display:block;background:#F2F8FC;border-radius:16px\">\n<rect x=\"238\" y=\"14\" width=\"46\" height=\"108\" rx=\"6\" fill=\"#FBD9B5\"><\u002Frect>\n<path d=\"M16 100 L52 84 L88 96 L124 70 L160 88 L196 62 L232 80 L262 38 L292 78 L328 60 L364 82 L386 66\" fill=\"none\" stroke=\"#0B3B7C\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n<circle cx=\"262\" cy=\"38\" r=\"5\" fill=\"#B45309\"><\u002Fcircle>\n<path d=\"M16 130h368\" stroke=\"#C4D6E6\" stroke-width=\"1\"><\u002Fpath>\n<\u002Fsvg>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:10px\">\n<div style=\"padding:12px 14px;border-radius:14px;background:#F2F8FC\"><div style=\"font-size:12px;font-weight:600;color:#4A5D78\">Heart rate<\u002Fdiv><div style=\"font-size:15px;font-weight:700;color:#0B3B7C\">[stream]<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:12px 14px;border-radius:14px;background:#F2F8FC\"><div style=\"font-size:12px;font-weight:600;color:#4A5D78\">SpO<sub>2<\u002Fsub><\u002Fdiv><div style=\"font-size:15px;font-weight:700;color:#0B3B7C\">[stream]<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:12px 14px;border-radius:14px;background:#F2F8FC\"><div style=\"font-size:12px;font-weight:600;color:#4A5D78\">Activity<\u002Fdiv><div style=\"font-size:15px;font-weight:700;color:#0B3B7C\">[stream]<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:12px 14px;border-radius:14px;background:#F2F8FC\"><div style=\"font-size:12px;font-weight:600;color:#4A5D78\">Environment<\u002Fdiv><div style=\"font-size:15px;font-weight:700;color:#0B3B7C\">[stream]<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:15px;line-height:1.6;color:#3F5471\">The genetic profile sits beside the timeline, so a spike can be read against the patient's baseline susceptibility.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- METHOD -->\n<section id=\"method\" style=\"background:#FFFFFF\">\n<div style=\"max-width:1200px;margin:0 auto;padding:96px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:56px\">\n\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<span style=\"font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#0F7A5C\">Research objectives<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(28px,3.6vw,38px);line-height:1.15;letter-spacing:-1px;color:#0B3B7C;text-wrap:balance\">What we set out to show<\u002Fh2>\n<ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:16px\">\n<li style=\"display:flex;gap:16px;align-items:flex-start\"><span style=\"flex:none;width:44px;height:44px;border-radius:50%;background:#0B3B7C;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px\">RO1<\u002Fspan><span style=\"font-size:16px;line-height:1.6;color:#3F5471;padding-top:8px\">Fuse genetic, physiological and environmental data into a single asthma risk model.<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:16px;align-items:flex-start\"><span style=\"flex:none;width:44px;height:44px;border-radius:50%;background:#0B3B7C;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px\">RO2<\u002Fspan><span style=\"font-size:16px;line-height:1.6;color:#3F5471;padding-top:8px\">Test whether adapting to an individual's genetic profile improves prediction over a non-adaptive baseline.<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:16px;align-items:flex-start\"><span style=\"flex:none;width:44px;height:44px;border-radius:50%;background:#0B3B7C;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px\">RO3<\u002Fspan><span style=\"font-size:16px;line-height:1.6;color:#3F5471;padding-top:8px\">Generate explanations that patients and clinicians find clear and useful.<\u002Fspan><\u002Fli>\n<li style=\"display:flex;gap:16px;align-items:flex-start\"><span style=\"flex:none;width:44px;height:44px;border-radius:50%;background:#0B3B7C;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px\">RO4<\u002Fspan><span style=\"font-size:16px;line-height:1.6;color:#3F5471;padding-top:8px\">Deliver the result as a patient app and a clinician decision-support dashboard.<\u002Fspan><\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<span style=\"font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#0F7A5C\">Method and evaluation<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(28px,3.6vw,38px);line-height:1.15;letter-spacing:-1px;color:#0B3B7C;text-wrap:balance\">How we will test it<\u002Fh2>\n<dl style=\"margin:0;display:flex;flex-direction:column;gap:0;border-top:1px solid #D5E4F0\">\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:6px 20px;padding:18px 0;border-bottom:1px solid #D5E4F0\"><dt style=\"font-weight:700;color:#0B3B7C\">Data<\u002Fdt><dd style=\"margin:0;color:#3F5471;line-height:1.6;grid-column:span 2\">[ADD: datasets, cohort size, collection period, ethics approval]<\u002Fdd><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:6px 20px;padding:18px 0;border-bottom:1px solid #D5E4F0\"><dt style=\"font-weight:700;color:#0B3B7C\">Model<\u002Fdt><dd style=\"margin:0;color:#3F5471;line-height:1.6;grid-column:span 2\">[ADD: encoders, fusion strategy, adaptation mechanism]<\u002Fdd><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:6px 20px;padding:18px 0;border-bottom:1px solid #D5E4F0\"><dt style=\"font-weight:700;color:#0B3B7C\">Baselines<\u002Fdt><dd style=\"margin:0;color:#3F5471;line-height:1.6;grid-column:span 2\">[ADD: single-modality and non-adaptive comparisons]<\u002Fdd><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:6px 20px;padding:18px 0;border-bottom:1px solid #D5E4F0\"><dt style=\"font-weight:700;color:#0B3B7C\">Metrics<\u002Fdt><dd style=\"margin:0;color:#3F5471;line-height:1.6;grid-column:span 2\">[ADD: e.g. AUROC, sensitivity, calibration, lead time]<\u002Fdd><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:6px 20px;padding:18px 0;border-bottom:1px solid #D5E4F0\"><dt style=\"font-weight:700;color:#0B3B7C\">Explainability<\u002Fdt><dd style=\"margin:0;color:#3F5471;line-height:1.6;grid-column:span 2\">[ADD: attribution method and user evaluation plan]<\u002Fdd><\u002Fdiv>\n<\u002Fdl>\n<p style=\"margin:0;font-size:14px;color:#4A5D78\">Results will be published here as they become available. [ADD: results section or link]<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- TEAM -->\n<section id=\"team\" style=\"background:#F2F8FC\">\n<div style=\"max-width:1200px;margin:0 auto;padding:96px 24px;display:flex;flex-direction:column;gap:48px\">\n<div style=\"display:flex;flex-direction:column;gap:16px;max-width:720px\">\n<span style=\"font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#0F7A5C\">Team<\u002Fspan>\n<h2 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(30px,4vw,44px);line-height:1.15;letter-spacing:-1px;color:#0B3B7C\">The people behind GeneAir<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:24px\">\n<div style=\"background:#FFFFFF;border:1px solid #D5E4F0;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:12px\"><div style=\"width:72px;height:72px;border-radius:50%;background:#DCE8F3;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;color:#0B3B7C\">[ ]<\u002Fdiv><strong style=\"font-family:'Sora',sans-serif;font-size:18px;color:#0B3B7C\">[RESEARCHER NAME]<\u002Fstrong><span style=\"font-size:15px;color:#3F5471\">[Role · focus area]<\u002Fspan><\u002Fdiv>\n<div style=\"background:#FFFFFF;border:1px solid #D5E4F0;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:12px\"><div style=\"width:72px;height:72px;border-radius:50%;background:#DCE8F3;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;color:#0B3B7C\">[ ]<\u002Fdiv><strong style=\"font-family:'Sora',sans-serif;font-size:18px;color:#0B3B7C\">[RESEARCHER NAME]<\u002Fstrong><span style=\"font-size:15px;color:#3F5471\">[Role · focus area]<\u002Fspan><\u002Fdiv>\n<div style=\"background:#FFFFFF;border:1px solid #D5E4F0;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:12px\"><div style=\"width:72px;height:72px;border-radius:50%;background:#DCE8F3;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;color:#0B3B7C\">[ ]<\u002Fdiv><strong style=\"font-family:'Sora',sans-serif;font-size:18px;color:#0B3B7C\">[RESEARCHER NAME]<\u002Fstrong><span style=\"font-size:15px;color:#3F5471\">[Role · focus area]<\u002Fspan><\u002Fdiv>\n<div style=\"background:#FFFFFF;border:1px solid #D5E4F0;border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:12px\"><div style=\"width:72px;height:72px;border-radius:50%;background:#DCE8F3;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;color:#0B3B7C\">[ ]<\u002Fdiv><strong style=\"font-family:'Sora',sans-serif;font-size:18px;color:#0B3B7C\">[SUPERVISOR NAME]<\u002Fstrong><span style=\"font-size:15px;color:#3F5471\">[Supervisor · department]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONTACT -->\n<section id=\"contact\" style=\"background:#FFFFFF\">\n<div style=\"max-width:1200px;margin:0 auto;padding:96px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:48px;align-items:center\">\n<div style=\"display:flex;flex-direction:column;gap:16px\">\n<h2 style=\"margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:clamp(30px,4vw,44px);line-height:1.15;letter-spacing:-1px;color:#0B3B7C;text-wrap:balance\">Collaborate, review or ask a question<\u002Fh2>\n<p style=\"margin:0;font-size:17px;line-height:1.7;color:#3F5471;max-width:520px;text-wrap:pretty\">We welcome conversations with clinicians, data scientists and patient groups interested in personalized asthma care.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px;padding:32px;border-radius:24px;background:#F2F8FC\">\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:13px;font-weight:600;color:#4A5D78\">Email<\u002Fspan><span style=\"font-weight:700;color:#0B3B7C\">[YOUR EMAIL]<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:13px;font-weight:600;color:#4A5D78\">Institution<\u002Fspan><span style=\"font-weight:700;color:#0B3B7C\">[YOUR INSTITUTION / DEPARTMENT]<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:13px;font-weight:600;color:#4A5D78\">Publications and code<\u002Fspan><span style=\"font-weight:700;color:#0B3B7C\">[LINKS]<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"background:#0B2A55;color:#C9D9EC\">\n<div style=\"max-width:1200px;margin:0 auto;padding:40px 24px;display:flex;flex-wrap:wrap;gap:20px 40px;align-items:center;justify-content:space-between\">\n<div style=\"display:flex;align-items:center;gap:12px\">\n<img src=\"41cbc137-8353-423b-aea8-28ee2629da43\" alt=\"\" style=\"width:40px;height:40px;object-fit:contain;border-radius:50%;background:#FFFFFF\">\n<span style=\"font-family:'Sora',sans-serif;font-weight:700;color:#FFFFFF\">GeneAir · Genetic-Adaptive Asthma Intelligence System<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:14px;line-height:1.6;max-width:520px\">GeneAir is a research prototype. It is not a medical device and does not replace professional medical advice, diagnosis or treatment.<\u002Fp>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1366,&quot;height&quot;:4700}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
